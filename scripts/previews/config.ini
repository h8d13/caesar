; Server config for preview recording only (copied into the throwaway data
; dir by entry.sh). The scenarios sign several users in and click through
; the app faster than the default limits allow.

[rateLimiters.login]
maxRequests=1000

[rateLimiters.handshake]
maxRequests=1000

[rateLimiters.joinServer]
maxRequests=1000

[rateLimiters.addInvite]
maxRequests=1000

[rateLimiters.joinVoiceChannel]
maxRequests=1000

[rateLimiters.sendAndEditMessage]
maxRequests=1000

[rateLimiters.changeAvatar]
maxRequests=1000

[rateLimiters.openDirectMessage]
maxRequests=1000
