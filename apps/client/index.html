<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_NAME%</title>
    <!-- linked, not imported from main.tsx: a JS-injected sheet only lands
         once the whole module graph has loaded, so the static shell below
         painted unstyled (white, tiny spinner) in dev until then -->
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      // mirrors ThemeProvider so the static shell below paints in the right
      // theme before the bundle arrives (no light flash on slow links)
      try {
        var t = localStorage.getItem('vite-ui-theme');
        if (!t || t === 'system')
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- same markup as screens/loading-app: painted from HTML alone, so
           LCP doesn't wait on the JS bundle; React replaces it on mount -->
      <div class="flex flex-col justify-center items-center h-full gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 48 48"
          width="24"
          height="24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="animate-spin h-16 w-16"
        >
          <path d="M42 24a18 18 0 1 1-12.438-17.12" />
        </svg>
        <span class="text-xl">Loading %APP_NAME%</span>
      </div>
    </div>
    <div id="portal"></div>
    <div id="imagePortal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
