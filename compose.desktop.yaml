name: caesar-desktop

# Linux packages of the desktop app without node on the host:
#   podman-compose -f compose.desktop.yaml run --rm caesar-desktop
#     -> apps/desktop/release/ (AppImage, deb, rpm)
# macOS/Windows installers need their own OS.

services:
  caesar-desktop:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    restart: "no"
    cpus: 4
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/apps/client/node_modules
      - server_node_modules:/app/apps/server/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - desktop_node_modules:/app/apps/desktop/node_modules
      - pnpm:/pnpm
      - cache:/cache

volumes:
  node_modules:
  client_node_modules:
  server_node_modules:
  shared_node_modules:
  ui_node_modules:
  desktop_node_modules:
  pnpm:
  cache:
