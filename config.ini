; Caesar rate limits + login lockout. Mounted read-only into the container;
; the server never writes it. Every key below is commented out at its
; default: uncomment and change only what you need, then
;   docker compose restart caesar
; Unknown keys or bad values stop the server at boot with the key named.
; windowMs values are milliseconds.

[rateLimiters.sendAndEditMessage]
;maxRequests=15
;windowMs=60000

[rateLimiters.joinVoiceChannel]
;maxRequests=20
;windowMs=60000

[rateLimiters.login]
;maxRequests=5
;windowMs=60000

[rateLimiters.joinServer]
;maxRequests=5
;windowMs=60000

[rateLimiters.signalTyping]
;maxRequests=40
;windowMs=5000

[rateLimiters.getMessages]
;maxRequests=60
;windowMs=10000

[rateLimiters.markAsRead]
;maxRequests=60
;windowMs=10000

[rateLimiters.toggleMessageReaction]
;maxRequests=60
;windowMs=10000

[rateLimiters.addEmoji]
;maxRequests=10
;windowMs=60000

[rateLimiters.openDirectMessage]
;maxRequests=10
;windowMs=60000

[rateLimiters.handshake]
;maxRequests=10
;windowMs=60000

[rateLimiters.publicFile]
;maxRequests=120
;windowMs=60000

[rateLimiters.updatePassword]
;maxRequests=5
;windowMs=60000

[rateLimiters.resetPassword]
;maxRequests=5
;windowMs=60000

[rateLimiters.uploadFile]
;maxRequests=20
;windowMs=60000

[rateLimiters.searchMessages]
;maxRequests=20
;windowMs=60000

[rateLimiters.deleteMessage]
;maxRequests=30
;windowMs=60000

[rateLimiters.toggleMessagePin]
;maxRequests=30
;windowMs=60000

[rateLimiters.toggleMessageScVote]
;maxRequests=30
;windowMs=60000

[rateLimiters.voteSocialCredit]
;maxRequests=20
;windowMs=60000

[rateLimiters.renameIdentity]
;maxRequests=5
;windowMs=60000

[rateLimiters.addInvite]
;maxRequests=10
;windowMs=60000

[rateLimiters.changeAvatar]
;maxRequests=10
;windowMs=60000

[rateLimiters.changeBanner]
;maxRequests=10
;windowMs=60000

[rateLimiters.playSoundboard]
;maxRequests=30
;windowMs=60000

; Failed logins per IP: after maxFailures inside windowMs the IP is locked
; for baseLockMs, doubling per extra failure up to maxLockMs.
[loginLockout]
;maxFailures=10
;windowMs=900000
;baseLockMs=300000
;maxLockMs=3600000
