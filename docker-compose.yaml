name: caesar

# Production: published image + Caddy HTTPS. Download it with config.ini
# (see below); works with docker compose or rootless podman-compose:
#   docker compose up -d                          (first run / start)
#   docker compose pull && docker compose up -d --force-recreate   (update;
#   podman-compose keeps running containers on a re-pulled tag without it)
# Local builds of the checkout: compose.prod-dev.yaml. Settings: .env and
# config.ini, see wiki Configuration. Aliases / extra instances:
# wiki Home#custom-caddyfile.

services:
  caesar:
    # edge = master (default until the first release), sha-<short> = exact
    # commit, latest / x.y / x.y.z = releases
    image: ghcr.io/h8d13/caesar:${CAESAR_IMAGE_TAG:-edge}
    container_name: caesar
    restart: unless-stopped
    stop_grace_period: 2s
    # Confinement: uid 1000 (image), no capabilities, no setuid gain. /app in
    # the image is root-owned and read-only; only the data volume is writable.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Limits keep a runaway server from taking the host (sshd, caddy) down
    # with it. Memory: Node heap + one mediasoup-worker per
    # CAESAR_WEBRTC_WORKERS + 64 MiB per login being hashed (argon2); on a
    # small VPS leave ~512m for the host, on a big one raise it. CPUs: 0 =
    # no cap, because Docker refuses to start a container asking for more
    # CPUs than the host has (a fixed "4" breaks 1-2 vCPU servers); set it
    # to at most your vCPU count. pids counts threads too (about 30 at idle).
    mem_limit: ${CAESAR_MEM_LIMIT:-2g}
    cpus: ${CAESAR_CPUS:-0}
    pids_limit: 512
    # Without this the default json-file log grows until the disk is full.
    # podman documents max-size only; it accepts max-file without error.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "40000-40002:40000-40002/tcp"
      - "40000-40002:40000-40002/udp"
    # Every knob from wiki Configuration goes in .env and reaches the server
    # through env_file. `environment:` wins over it, so defaults that differ
    # from the server's own (or that caddy shares) are `${VAR:-default}`.
    env_file:
      - path: .env
        required: false
    environment:
      CAESAR_PORT: ${CAESAR_PORT:-4991}
      CAESAR_SITE: ${CAESAR_SITE:-localhost}
      # must match the published 40000+ range above
      CAESAR_WEBRTC_WORKERS: ${CAESAR_WEBRTC_WORKERS:-3}
    # Named volume: first mount copies the image's DATA_PATH, owned by uid
    # 1000, so it is writable under any engine/userns without a host chown.
    # config.ini (rate limits) must exist next to this file: a missing bind
    # source gets created as a directory and the server refuses to boot.
    volumes:
      - caesar_data:/home/node/.config/caesar
      - ./config.ini:/home/node/.config/caesar/config.ini:ro

  # `caddy reverse-proxy` instead of a Caddyfile: no extra file to ship
  # (podman-compose ignores top-level configs).
  caddy:
    image: docker.io/library/caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    container_name: caesar-caddy
    restart: unless-stopped
    depends_on:
      - caesar
    # Caddy runs as root in its container; NET_BIND_SERVICE (bind 80/443) is
    # the only capability it needs. Its volumes stay writable: root owns them.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    pids_limit: 512
    logging: *logging
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    # Same defaults as the caesar service above; changing one changes both.
    command: >-
      caddy reverse-proxy
      --from ${CAESAR_SITE:-localhost}
      --to caesar:${CAESAR_PORT:-4991}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caesar_data:
  caddy_data:
  caddy_config:
