services:
  # Production: compiled binary with embedded frontend
  # assumes x86_64 or adapt bungig.toml and mediasoup download
  caesar:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: caesar
    restart: unless-stopped
    stop_grace_period: 2s
    profiles: ["prod"]
    ports:
      - "40000:40000/tcp"
      - "40000:40000/udp"
    environment:
      CAESAR_PORT: "4991"
    volumes:
      - ./data:/home/caesar/.config/caesar

  # HTTPS reverse proxy see caddy/Caddyfile
  caddy:
    image: caddy:alpine
    container_name: caesar-caddy
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - caesar
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Dev: Runs bun install then runs Vite + Bun server
  caesar-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: caesar-dev
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "4991:4991/tcp"
      - "5173:5173/tcp"
      - "40000:40000/tcp"
      - "40000:40000/udp"
    environment:
      CAESAR_PORT: "4991"
    volumes:
      - ./data:/home/bun/.config/caesar 
      # here named volume would be more appropriate

volumes:
  caddy_data:
  caddy_config:

