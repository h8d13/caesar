packages:
  - 'apps/*'
  - 'packages/*'

# One version per dep shared by several packages, so overlapping
# packages resolve to a single copy. strict: `pnpm add` of a cataloged
# dep must use `catalog:`, so ranges can't drift apart again.
catalogMode: strict
catalog:
  # client and server must match
  '@trpc/client': ^11.19.0
  '@trpc/server': ^11.19.0
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  clsx: ^2.1.1
  drizzle-orm: ^0.45.4
  lucide-react: ^1.55.0
  mediasoup: 3.29.0
  react: ^19.3.1
  react-dom: ^19.3.1
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  typescript: ~7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0

# Whitelist of native deps whose postinstall scripts we permit; anything
# else with a build script fails the install (pnpm's default strictDepBuilds).
# (mediasoup's postinstall downloads a prebuilt worker for linux x64/arm64,
# kernel 6/7; it only falls back to a python+pip source build without one.)
allowBuilds:
  argon2: true
  # drizzle-orm declares better-sqlite3 as a peer dep, so pnpm installs
  # it even though we use the libsql driver. Allow its postinstall so
  # pnpm doesn't warn; we never actually load the .node binding.
  better-sqlite3: true
  esbuild: true
  mediasoup: true

# Refuse versions published less than 24h ago. Catches compromised releases
# during the window where a malicious publish hasn't been detected yet.
# Bump to 10080 (1 week) if same-day upgrades aren't needed. Renovate is
# configured with `minimumReleaseAge: 3 days` so it never proposes a bump
# that would fail this check at install time.
minimumReleaseAge: 1440

# Fail install when node is below package.json "engines" (Dockerfiles, CI
# and dev all install through here). pnpm 12 reads it only from this file:
# an `engine-strict` in .npmrc is silently ignored.
engineStrict: true

# Force a single @libsql/client version repo-wide. drizzle-orm's peer-dep
# resolution otherwise instantiates two drizzle copies (one parametrized
# per libsql version found in the graph), and TS sees them as different
# types ("Type '...drizzle-orm@x/y/Column' is not assignable to ...").
overrides:
  '@libsql/client': '0.18.0'
  vite@*: 'catalog:'

# `pnpm deploy` requires workspace packages to be injected
# (hardlinked into the deploy node_modules) instead of symlinked, so the
# deployed artifact is self-contained outside the monorepo. Without this
# flag pnpm errors with ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE.
injectWorkspacePackages: true

# vite is aliased to @voidzero-dev/vite-plus-core (catalog), so peers see its
# own version (1.x) instead of the Vite it bundles (8.x for all of Vite+ 1).
# Review on a vite-plus major: the bundled Vite may move past plugin ranges.
peerDependencyRules:
  allowedVersions:
    vite: '1.x'
