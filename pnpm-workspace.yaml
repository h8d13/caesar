packages:
  - 'apps/*'
  - 'packages/*'

# One version per dep shared by several packages (or by a package and an
# override), so overlapping packages resolve to a single copy. Also holds
# deps that must move in lockstep with another entry. strict: `pnpm add`
# of a cataloged dep must use `catalog:`, so ranges can't drift apart.
catalogMode: strict
catalog:
  # 0.x, all on one @dnd-kit/abstract: a minor skew installs a second copy
  # (collision detectors/constraints typed against the other one). Exact.
  '@dnd-kit/collision': 0.5.3
  '@dnd-kit/dom': 0.5.3
  '@dnd-kit/react': 0.5.3
  # also consumed by overrides below
  '@libsql/client': 0.18.0
  # depends on tailwindcss at its own exact version: keep both equal
  '@tailwindcss/vite': ^4.3.5
  # client and server must match
  '@trpc/client': ^11.28.0
  '@trpc/server': ^11.28.0
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  clsx: ^2.1.1
  drizzle-orm: ^0.45.4
  lucide-react: ^1.72.0
  mediasoup: 3.32.2
  react: ^19.3.1
  react-dom: ^19.3.1
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.5
  typescript: ~7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0

# Whitelist of native deps whose postinstall scripts we permit; anything
# else with a build script fails the install (pnpm's default strictDepBuilds).
# (mediasoup's postinstall downloads a prebuilt worker for linux x64/arm64,
# kernel 6/7; it only falls back to a python+pip source build without one.)
allowBuilds:
  argon2: true
  esbuild: true
  mediasoup: true

# Supply-chain guard: refuse versions <24h old (10080 = 1 week if same-day
# upgrades aren't needed). Renovate waits 3 days so its bumps never fail it.
minimumReleaseAge: 1440

# Fail install when node is below package.json "engines" (Dockerfiles, CI
# and dev all install through here). pnpm 12 reads it only from this file:
# an `engine-strict` in .npmrc is silently ignored.
engineStrict: true

# Force a single @libsql/client version repo-wide. drizzle-orm's peer-dep
# resolution otherwise instantiates two drizzle copies (one parametrized
# per libsql version found in the graph), and TS sees them as different
# types ("Type '...drizzle-orm@x/y/Column' is not assignable to ...").
overrides:
  '@libsql/client': 'catalog:'
  vite@*: 'catalog:'

# `pnpm deploy` requires workspace packages to be injected
# (hardlinked into the deploy node_modules) instead of symlinked, so the
# deployed artifact is self-contained outside the monorepo. Without this
# flag pnpm errors with ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE.
injectWorkspacePackages: true

# vite is aliased to @voidzero-dev/vite-plus-core (catalog), so peers see its
# own version (1.x) instead of the Vite it bundles (8.x for all of Vite+ 1).
# Review on a vite-plus major: the bundled Vite may move past plugin ranges.
peerDependencyRules:
  allowedVersions:
    vite: '1.x'
